name: Refresh Football Contribution Calendar

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-contribution-calendar
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Remove floating orbs and slow profile animations
        run: python scripts/slow_profile_animations.py

      - name: Generate football contribution animation
        run: python scripts/generate_football_contributions.py

      - name: Commit refreshed contribution calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.gif assets/.profile-animations-slowed-v1
          if git diff --cached --quiet; then
            echo "Contribution calendar is unchanged."
          else
            git commit -m "Refresh football contribution calendar"
            git push
          fi
