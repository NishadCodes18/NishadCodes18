name: Animate the Year of Building

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-contribution-animation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Fetch GitHub activity and animate the footballer
        run: python scripts/generate_football_contributions.py

      - name: Commit updated contribution animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/year-of-building.gif
          if git diff --cached --quiet; then
            echo "Contribution animation is unchanged."
          else
            git commit -m "Refresh animated football contribution calendar"
            git push
          fi
