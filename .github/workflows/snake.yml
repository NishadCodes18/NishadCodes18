name: Refresh Football Coding Scoreboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-scoreboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish football-inspired coding scoreboard
        run: |
          test -f assets/football-scoreboard.svg
          mkdir -p public
          cp assets/football-scoreboard.svg public/football-scoreboard.svg

      - name: Publish asset to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./public
          keep_files: true
